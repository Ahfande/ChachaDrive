<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SecureCloud</title>
    
    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Font Awesome untuk ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <!-- Link CSS -->
    <link rel="stylesheet" href="/static/css/login.css">
</head>
<body>
    
    <!-- Background dengan animasi partikel -->
    <div class="bg-animation">
        <div class="circle circle-1"></div>
        <div class="circle circle-2"></div>
        <div class="circle circle-3"></div>
        <div class="circle circle-4"></div>
        <div class="circle circle-5"></div>
    </div>

    <!-- Container Utama -->
    <div class="container">
        
        <!-- Kotak Login dengan efek glass -->
        <div class="login-box glass-effect">
            
            <!-- Dekorasi sudut -->
            <div class="corner-deco corner-tl"></div>
            <div class="corner-deco corner-tr"></div>
            <div class="corner-deco corner-bl"></div>
            <div class="corner-deco corner-br"></div>
            
            <!-- Badge keamanan -->
            <div class="security-badge">
                <i class="fas fa-shield-alt"></i>
                <span>Enkripsi ChaCha20-Poly1305</span>
            </div>
            
            <!-- Icon dengan animasi floating -->
            <div class="login-icon-wrapper">
                <div class="login-icon">
                    <i class="fas fa-cloud"></i>
                </div>
                <div class="icon-ring"></div>
            </div>
            
            <!-- Judul -->
            <h2 class="login-title">Selamat Datang Kembali</h2>
            <p class="login-subtitle">Masuk ke akun SecureCloud Anda</p>
            
            <!-- Form Login -->
            <form id="loginForm" onsubmit="handleLogin(event)">
                
                <!-- Input Email -->
                <div class="form-group">
                    <label for="email" class="form-label">
                        <i class="fas fa-envelope"></i> Email
                    </label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope input-icon"></i>
                        <input 
                            type="email" 
                            id="email" 
                            class="form-control" 
                            placeholder="Masukkan email Anda"
                            autocomplete="email"
                            required
                        >
                    </div>
                    <div class="form-error" id="emailError"></div>
                </div>
                
                <!-- Input Password -->
                <div class="form-group">
                    <label for="password" class="form-label">
                        <i class="fas fa-lock"></i> Password
                    </label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock input-icon"></i>
                        <input 
                            type="password" 
                            id="password" 
                            class="form-control" 
                            placeholder="Masukkan password Anda"
                            autocomplete="current-password"
                            required
                        >
                        <button type="button" class="toggle-password" id="togglePassword" aria-label="Toggle password visibility">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <div class="form-error" id="passwordError"></div>
                </div>
                
                <!-- Opsi -->
                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="rememberMe">
                        <span class="custom-checkbox">
                            <i class="fas fa-check"></i>
                        </span>
                        Ingat Saya
                    </label>
                    <a href="#" class="forgot-link">
                        <i class="fas fa-key"></i> Lupa Password?
                    </a>
                </div>
                
                <!-- Tombol Login -->
                <button type="submit" class="btn-login" id="loginBtn">
                    <span class="btn-content" id="btnContent">
                        <span class="btn-text" id="btnText">Masuk</span>
                        <i class="fas fa-arrow-right btn-icon"></i>
                    </span>
                    <span class="spinner" id="btnSpinner" style="display: none;"></span>
                </button>
                
            </form>
            
            <!-- Divider -->
            <div class="divider">
                <span>atau</span>
            </div>
            
            <!-- Link Daftar -->
            <p class="register-link">
                Belum punya akun? <a href="/register/">Daftar Sekarang <i class="fas fa-arrow-right"></i></a>
            </p>
            
        </div>
        
    </div>
    
    <!-- Alert Container -->
    <div id="alertContainer"></div>
    
    <script src="/static/js/login.js"></script>
    
</body>
</html>
