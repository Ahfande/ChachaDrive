<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - SecureCloud</title>

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Font Awesome untuk ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- Link CSS -->
    <link rel="stylesheet" href="/static/css/login.css">
</head>
<body>

    <!-- Background -->
    <div class="bg-animation">
        <div class="circle circle-1"></div>
        <div class="circle circle-2"></div>
    </div>

    <!-- Container Utama -->
    <div class="container">

        <!-- Kotak Reset Password -->
        <div class="login-box glass-effect">

            <!-- Badge keamanan -->
            <div class="security-badge">
                <i class="fas fa-shield-alt"></i>
                <span>Enkripsi ChaCha20-Poly1305</span>
            </div>

            <!-- Icon -->
            <div class="login-icon-wrapper">
                <div class="login-icon">
                    <i class="fas fa-key"></i>
                </div>
                <div class="icon-ring"></div>
            </div>

            <!-- Judul -->
            <h2 class="login-title">Buat Password Baru</h2>
            <p class="login-subtitle">Masukkan password baru untuk akun Anda</p>

            <!-- State: form reset -->
            <form id="resetForm">

                <!-- Password Baru -->
                <div class="form-group">
                    <label for="newPassword" class="form-label">
                        <i class="fas fa-lock"></i> Password Baru
                    </label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock input-icon"></i>
                        <input
                            type="password"
                            id="newPassword"
                            class="form-control"
                            placeholder="Minimal 8 karakter"
                            autocomplete="new-password"
                            required
                        >
                        <button type="button" class="toggle-password" id="toggleNewPassword" aria-label="Toggle password visibility">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <div class="form-error" id="newPasswordError"></div>
                </div>

                <!-- Konfirmasi Password -->
                <div class="form-group">
                    <label for="confirmPassword" class="form-label">
                        <i class="fas fa-check-circle"></i> Konfirmasi Password
                    </label>
                    <div class="input-wrapper">
                        <i class="fas fa-check-circle input-icon"></i>
                        <input
                            type="password"
                            id="confirmPassword"
                            class="form-control"
                            placeholder="Ulangi password baru"
                            autocomplete="new-password"
                            required
                        >
                    </div>
                    <div class="form-error" id="confirmPasswordError"></div>
                </div>

                <!-- Tombol -->
                <button type="submit" class="btn-login" id="resetBtn">
                    <span class="btn-content" id="btnContent">
                        <span class="btn-text" id="btnText">Simpan Password Baru</span>
                        <i class="fas fa-arrow-right btn-icon"></i>
                    </span>
                    <span class="spinner" id="btnSpinner" style="display: none;"></span>
                </button>

            </form>

            <!-- State: token tidak valid (disembunyikan default) -->
            <div id="invalidTokenState" style="display: none; text-align: center;">
                <p class="login-subtitle" style="margin-bottom: 18px;">
                    Link reset password tidak valid atau sudah kedaluwarsa. Silakan minta link baru.
                </p>
                <a href="/login/" class="btn-login" style="text-decoration: none; display: inline-flex;">
                    <span class="btn-content">
                        <span class="btn-text">Kembali ke Login</span>
                        <i class="fas fa-arrow-right btn-icon"></i>
                    </span>
                </a>
            </div>

            <!-- Divider -->
            <div class="divider">
                <span>atau</span>
            </div>

            <!-- Link Login -->
            <p class="register-link">
                Sudah ingat password? <a href="/login/">Masuk <i class="fas fa-arrow-right"></i></a>
            </p>

        </div>

    </div>

    <!-- Alert Container -->
    <div id="alertContainer"></div>

    <script src="/static/js/reset-password.js"></script>

</body>
</html>
